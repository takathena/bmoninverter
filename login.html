<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login - SPF Gateway</title>
<style>
  :root { --bg: #f9f9f9; --text: #111; --border: #333; --input-bg: #fff; }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Courier New", Courier, monospace; }
  body { background: var(--bg); color: var(--text); display: flex; align-items: center; justify-content: center; height: 100vh; }
  .login-box { border: 1px solid var(--border); background: var(--input-bg); padding: 40px; width: 100%; max-width: 400px; }
  h1 { font-size: 18px; font-weight: normal; margin-bottom: 30px; text-transform: uppercase; letter-spacing: 2px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
  label { display: block; margin-bottom: 8px; font-size: 12px; text-transform: uppercase; font-weight: bold; }
  input { width: 100%; padding: 10px; border: 1px solid var(--border); margin-bottom: 20px; font-family: inherit; font-size: 14px; outline: none; }
  input:focus { border-color: #000; background: #f0f0f0; }
  button { width: 100%; padding: 12px; background: var(--text); color: var(--bg); border: 1px solid var(--border); cursor: pointer; text-transform: uppercase; font-weight: bold; letter-spacing: 1px; }
  button:hover { background: #333; }
  .error { background: #ddd; border: 1px solid #000; padding: 10px; margin-bottom: 20px; font-size: 12px; display: none; }
</style>
</head>
<body>
  <div class="login-box">
    <h1>SPF Gateway</h1>
    <div class="error" style="display: {{error}};">Akses ditolak. Periksa kredensial Anda.</div>
    <form action="/api/login" method="post">
      <label>Username</label>
      <input type="text" name="username" required autocomplete="username">
      <label>Password</label>
      <input type="password" name="password" required autocomplete="current-password">
      <button type="submit">Masuk</button>
    </form>
  </div>
</body>
</html>
